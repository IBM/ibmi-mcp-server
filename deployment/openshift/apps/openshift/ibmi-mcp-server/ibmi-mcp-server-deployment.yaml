apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibmi-mcp-server
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"ibmi-mcp-server:latest","namespace":"NAMESPACE_PLACEHOLDER"},"fieldPath":"spec.template.spec.containers[?(@.name==\"ibmi-mcp-server\")].image","paused":false}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ibmi-mcp-server
  template:
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ibmi-mcp-server
          image: image-registry.openshift-image-registry.svc:5000/NAMESPACE_PLACEHOLDER/ibmi-mcp-server
          ports:
            - containerPort: 3010
          envFrom:
            - secretRef:
                name: ibmi-mcp-server-env
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3010
              # kubelet sets Host to the pod IP, which the DNS rebinding
              # guard rejects (pod IPs are dynamic, so allowlisting them is
              # not viable). Override the probe's Host instead.
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3010
              # kubelet sets Host to the pod IP, which the DNS rebinding
              # guard rejects (pod IPs are dynamic, so allowlisting them is
              # not viable). Override the probe's Host instead.
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # The image's working directory is /app, so relative paths such as
            # IBMI_AUTH_PRIVATE_KEY_PATH=secrets/private.pem resolve to these mounts.
            - name: tools
              mountPath: /app/tools
            - name: secrets
              mountPath: /app/secrets
              readOnly: true
      volumes:
        - name: tools
          configMap:
            name: tools-config
        - name: secrets
          secret:
            secretName: ibmi-mcp-secrets
            defaultMode: 0400