kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: ibmi-mcp-server
spec:
  nodeSelector: null
  output:
    to:
      kind: ImageStreamTag
      name: 'ibmi-mcp-server:latest'
  strategy:
    type: Docker
    dockerStrategy:
      # The build context is the repo root (npm workspaces share the root
      # package-lock.json); the Dockerfile lives in the server package.
      dockerfilePath: packages/server/Dockerfile
  source:
    type: Git
    git:
      uri: "https://github.com/IBM/ibmi-mcp-server.git"
      ref: main
    contextDir: /
  triggers:
    - type: ConfigChange