apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: <NAMESPACE_PLACEHOLDER>

sortOptions:
  legacySortOptions:
    orderFirst:
    - ServiceAccount
    - RoleBinding
    - ConfigMap
    - Secret
    - ImageStream
    - BuildConfig
    - PersistentVolumeClaim
    - Deployment
    - Service
    - Route
  order: legacy

resources:
- mcpgateway
- ibmi-mcp-server

# These run here, not in the app directories: the source field
# (metadata.namespace) only exists once the namespace above has been applied.
replacements:
- source:
    kind: Deployment
    name: mcp-context-forge
    fieldPath: metadata.namespace
  targets:
  - select:
      kind: Deployment
      name: mcp-context-forge
    fieldPaths:
      - metadata.annotations.image\.openshift\.io/triggers
    options:
      delimiter: '"'
      index: 13 # Replace the NAMESPACE_PLACEHOLDER with actual namespace
  - select:
      kind: Deployment
      name: mcp-context-forge
    fieldPaths:
      - spec.template.spec.containers.[name=gateway].image
    options:
      delimiter: /
      index: 1 # Replace the NAMESPACE_PLACEHOLDER with actual namespace
- source:
    kind: Deployment
    name: ibmi-mcp-server
    fieldPath: metadata.namespace
  targets:
  - select:
      kind: Deployment
      name: ibmi-mcp-server
    fieldPaths:
      - metadata.annotations.image\.openshift\.io/triggers
    options:
      delimiter: '"'
      index: 13 # Replace the NAMESPACE_PLACEHOLDER with actual namespace
  - select:
      kind: Deployment
      name: ibmi-mcp-server
    fieldPaths:
      - spec.template.spec.containers.[name=ibmi-mcp-server].image
    options:
      delimiter: /
      index: 1 # Replace the NAMESPACE_PLACEHOLDER with actual namespace