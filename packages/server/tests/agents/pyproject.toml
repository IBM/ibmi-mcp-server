[project]
name = "agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agno[mcp]==2.9.0",
    "anthropic>=0.57.1",
    "duckduckgo-search>=8.1.1",
    "ibm-watsonx-ai>=1.3.36",
    "mcp>=1.12.4",
    "mcp-contextforge-gateway>=0.3.1",
    "ollama>=0.5.3",
    "openai>=1.96.0",
    "python-dotenv>=1.1.1",
]

[tool.uv]
# mcp-contextforge-gateway pins filelock<3.31, but filelock <4.2.1 is affected by
# GHSA-v4x8-3wr5-3wq8, GHSA-9vhv-jxww-xfm5 and GHSA-567q-5qvw-pf92. The gateway only
# uses FileLock/Timeout, whose API is unchanged in 4.x.
override-dependencies = ["filelock>=4.2.1"]
