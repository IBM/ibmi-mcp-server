version: 2
updates:
  # Version updates for the published packages only (@ibm/ibmi-mcp-server and
  # @ibm/ibmi-cli). The root entry covers both npm workspaces through the root
  # package-lock.json. Example and demo code is intentionally not listed.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
